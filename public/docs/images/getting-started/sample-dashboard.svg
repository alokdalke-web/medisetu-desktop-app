<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Inter, -apple-system, Segoe UI, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafb"/>
      <stop offset="1" stop-color="#e8f5f2"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4fbfa8"/>
      <stop offset="1" stop-color="#1a5e55"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <!-- sidebar -->
  <rect x="0" y="0" width="240" height="900" fill="#ffffff"/>
  <rect x="24" y="32" width="120" height="18" rx="6" fill="url(#accent)"/>
  <g fill="#cbd5e1">
    <rect x="24" y="90" width="180" height="12" rx="6"/>
    <rect x="24" y="122" width="150" height="12" rx="6"/>
    <rect x="24" y="154" width="170" height="12" rx="6"/>
    <rect x="24" y="186" width="140" height="12" rx="6"/>
  </g>
  <!-- topbar -->
  <rect x="240" y="0" width="1360" height="72" fill="#ffffff"/>
  <rect x="272" y="28" width="220" height="16" rx="8" fill="#0f172a" opacity="0.85"/>
  <circle cx="1540" cy="36" r="20" fill="url(#accent)"/>
  <!-- stat cards -->
  <g>
    <rect x="272" y="104" width="300" height="140" rx="16" fill="#ffffff"/>
    <rect x="600" y="104" width="300" height="140" rx="16" fill="#ffffff"/>
    <rect x="928" y="104" width="300" height="140" rx="16" fill="#ffffff"/>
    <rect x="1256" y="104" width="300" height="140" rx="16" fill="#ffffff"/>
  </g>
  <g fill="#30887C" font-size="34" font-weight="700">
    <text x="296" y="176">1,284</text>
    <text x="624" y="176">₹4.2L</text>
    <text x="952" y="176">96%</text>
    <text x="1280" y="176">42</text>
  </g>
  <g fill="#94a3b8" font-size="15">
    <text x="296" y="210">Appointments</text>
    <text x="624" y="210">Revenue</text>
    <text x="952" y="210">Show rate</text>
    <text x="1280" y="210">Active staff</text>
  </g>
  <!-- chart panel -->
  <rect x="272" y="280" width="820" height="380" rx="16" fill="#ffffff"/>
  <polyline points="320,600 440,540 560,560 680,470 800,500 920,410 1040,440"
            fill="none" stroke="url(#accent)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#30887C" opacity="0.9">
    <circle cx="440" cy="540" r="7"/><circle cx="680" cy="470" r="7"/><circle cx="920" cy="410" r="7"/>
  </g>
  <!-- side panel -->
  <rect x="1124" y="280" width="432" height="380" rx="16" fill="#ffffff"/>
  <g fill="#e2e8f0">
    <rect x="1156" y="320" width="368" height="44" rx="10"/>
    <rect x="1156" y="380" width="368" height="44" rx="10"/>
    <rect x="1156" y="440" width="368" height="44" rx="10"/>
    <rect x="1156" y="500" width="368" height="44" rx="10"/>
  </g>
  <text x="800" y="820" text-anchor="middle" fill="#94a3b8" font-size="20">
    Sample screenshot placeholder — replace with a real dashboard capture
  </text>
</svg>
